[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pair-programmer-alan-vo"
version = "1.0.0"
description = "AI pair programming terminal and dashboard for codebase-aware refactoring and AST analysis"
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
ai-pair-programmer = "app.main:cli_main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
